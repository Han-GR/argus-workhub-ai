name: argus
services:
  backend:
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
      args:
        DB: mysql
    restart: unless-stopped
    environment:
      ENVIRONMENT: prod
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8001
      DEBUG: "false"
      DATABASE_TYPE: mysql
      DATABASE_HOST: "${DATABASE_HOST:?请设置现有 MySQL 的地址}"
      DATABASE_PORT: "${DATABASE_PORT:-3306}"
      DATABASE_USER: "${DATABASE_USER:?请设置数据库用户}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:?请设置数据库密码}"
      DATABASE_NAME: "${DATABASE_NAME:-argus}"
      REDIS_HOST: "${REDIS_HOST:?请设置现有 Redis 的地址}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_USER: "${REDIS_USER:-}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB_NAME: "${REDIS_DB_NAME:-1}"
      SECRET_KEY: "${SECRET_KEY:?请设置令牌密钥}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
      PROD_CORS_ORIGINS: https://argus.ruitoolai.com
      ALLOWED_HOSTS: '["argus.ruitoolai.com"]'
      ALLOW_LOCALHOST_HOSTS: "false"
      FORWARDED_ALLOW_IPS: 10.255.178.0/24
      DEMO_ENABLE: "${DEMO_ENABLE:-false}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.deepseek.com}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-deepseek-v4-flash}"
      LOGGER_LEVEL: INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8001"
    volumes:
      - backend_uploads:/home/static/upload
      - backend_data:/home/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8001/api/v1/monitor/health/check',headers={'Host':'argus.ruitoolai.com','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cache-headers.inc:/etc/nginx/cache-headers.inc:ro
      - ./nginx/web/dist:/usr/share/nginx/html/web/dist:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
volumes:
  backend_uploads:
  backend_data:
networks:
  app_network:
    ipam:
      config:
        - subnet: 10.255.178.0/24
