name: argus
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MySQL root 密码}"
      MYSQL_DATABASE: "${DATABASE_NAME:-argus}"
      MYSQL_USER: "${DATABASE_USER:-argus}"
      MYSQL_PASSWORD: "${DATABASE_PASSWORD:?请设置数据库密码}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --host=127.0.0.1 --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  redis:
    # Redis 8 官方镜像包含 Search，供知识库执行 FT.CREATE / FT.SEARCH。
    image: redis:8.2
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?请设置 Redis 密码}"
    command: ["sh", "-c", 'exec docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDISCLI_AUTH"']
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG && redis-cli --raw COMMAND INFO FT.SEARCH | grep -qi '^FT.SEARCH$'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  backend:
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
      args:
        DB: mysql
    restart: unless-stopped
    environment:
      ENVIRONMENT: prod
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8001
      DEBUG: "false"
      DATABASE_TYPE: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: "${DATABASE_USER:-argus}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:?请设置数据库密码}"
      DATABASE_NAME: "${DATABASE_NAME:-argus}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: ""
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 Redis 密码}"
      REDIS_DB_NAME: "${REDIS_DB_NAME:-1}"
      SECRET_KEY: "${SECRET_KEY:?请设置令牌密钥}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
      PROD_CORS_ORIGINS: https://argus.ruitoolai.com
      ALLOWED_HOSTS: '["argus.ruitoolai.com"]'
      ALLOW_LOCALHOST_HOSTS: "false"
      FORWARDED_ALLOW_IPS: 10.255.178.0/24
      DEMO_ENABLE: "${DEMO_ENABLE:-false}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.deepseek.com}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-deepseek-v4-flash}"
      LOGGER_LEVEL: INFO
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/home/static/upload
      - backend_data:/home/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8001/api/v1/monitor/health/check',headers={'Host':'argus.ruitoolai.com','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cache-headers.inc:/etc/nginx/cache-headers.inc:ro
      - ./nginx/web/dist:/usr/share/nginx/html/web/dist:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
volumes:
  mysql_data:
  redis_data:
  backend_uploads:
  backend_data:
networks:
  app_network:
    ipam:
      config:
        - subnet: 10.255.178.0/24
